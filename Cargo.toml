[package]
name = "parallel-tar"
version = "4.2.1"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
cfg-if = "1.0.4"
clap = "4.6.6"
env_logger = "0.11.11"
flate2 = { version = "1.1.9", features = ["zlib-rs"] }
flume = { version = "0.12.0", features = ["spin"] }
log = { version = "0.4.34", features = ["kv", "serde", "std"] }
md5 = "0.8.1"
rayon = "1.12.0"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = "0.4.46"
walkdir = "2.5.0"

[lib]
name = "ptar_lib"
path = "src/lib.rs"

[[bin]]
name = "parallel-tar"
path = "src/main.rs"

[[bin]]
name = "parallel-idx"
path = "src/indexer.rs"

[[bin]]
name = "view-idx"
path = "src/viewer.rs"

[[bin]]
name = "diff-idx"
path = "src/differ.rs"

[[bin]]
name = "edit-idx"
path = "src/editor.rs"

[features]
std = []
