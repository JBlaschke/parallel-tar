[project]
name = "ptar-index"
version = "1.0.0"
description = "Python interface for parallel-tar (.etr / .idx) index files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Johannes Blaschke", email = "johannes@blaschke.science" },
]
keywords = ["tar", "parallel", "archive", "index", "msgpack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "msgpack>=1.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
ptar-index = "ptar_index:_cli"

[project.urls]
Homepage = "https://github.com/JBlaschke/parallel-tar"
Repository = "https://github.com/JBlaschke/parallel-tar"
Issues = "https://github.com/JBlaschke/parallel-tar/issues"
Documentation = "https://github.com/JBlaschke/parallel-tar/tree/main/python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptar_index"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
