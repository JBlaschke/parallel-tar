[project]
name = "ptar-index"
version = "0.1.0"
description = "Python interface for parallel-tar (.etr / .idx) index files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
ptar-index = "ptar_index:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ptar_index"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
