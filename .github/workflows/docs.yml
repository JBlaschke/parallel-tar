name: Documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel a deploy mid-flight
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest
    steps:
      # ------------------------------------------------------------------
      # 1. Checkout
      # ------------------------------------------------------------------
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 2. Set up Rust toolchain + build cache
      # ------------------------------------------------------------------
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      # ------------------------------------------------------------------
      # 3. Build the API docs (dependencies are vendored => offline).
      #    -D warnings keeps broken intra-doc links from slipping through.
      # ------------------------------------------------------------------
      - name: Build documentation
        run: cargo doc --no-deps --offline
        env:
          RUSTDOCFLAGS: -D warnings

      # ------------------------------------------------------------------
      # 4. Package for Pages: redirect the site root to the library docs
      #    and drop rustdoc's lock file, which upload-pages-artifact
      #    cannot read
      # ------------------------------------------------------------------
      - name: Finalize site
        run: |
          rm -f target/doc/.lock
          cat > target/doc/index.html <<'EOF'
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=ptar_lib/index.html">
          <a href="ptar_lib/index.html">Redirecting to ptar_lib documentation...</a>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
